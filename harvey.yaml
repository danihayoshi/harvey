channels:
  email:
    enabled: true
    provider: "gmail"          # gmail (recommended) | microsoft | smtp | instantly
    max_daily_sends: 50
    require_approval: true      # native providers: emails wait in the Outbox
    send_to_risky: false        # also send to catch-all domains (off = safest)
    max_bounce_rate: 0.05       # pause all sending if bounces exceed this
  linkedin:
    enabled: false
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "22:00"
    end: "07:00"
    timezone: "America/Sao_Paulo"

# Optional: check each new recipient with Precleared (precleared.dev) before
# the first cold email: may cold marketing email go to this address under UK
# PECR, US CAN-SPAM, Canada's CASL, Germany's UWG and France's rules? Any other
# answer holds the email back, with the reason in the Outbox. One check per
# address; 10 a day free without a key, 25 with a free key (PRECLEARED_API_KEY
# in .env). Applies to the native providers (gmail, smtp).
compliance:
  precleared:
    enabled: false
    sender_country: ""          # GB or US: where your business is based
    address_source: "unknown"   # published | bought | scraped | given | unknown
